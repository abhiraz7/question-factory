name: PUB.NOTE

on:
  push:
    branches: [main]
    paths:
      - "pending-notes/**.json"
  workflow_dispatch:
    inputs:
      file:
        description: "Retry a specific file (path like pending-notes/my-slug.json). Leave empty to process every pending note."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-notes
  cancel-in-progress: false

jobs:
  publish:
    # loop guard: never re-run on the bot's own commit that moves files to published-notes/
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending notes as WordPress drafts
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ONLY_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          if [ -z "${WP_SITE_URL:-}" ] || [ -z "${WP_USERNAME:-}" ] || [ -z "${WP_APP_PASSWORD:-}" ]; then
            echo "::error::Missing secrets. Set WP_SITE_URL, WP_USERNAME and WP_APP_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi

          # App label -> real taxonomy term name, matching what already exists on the
          # site (see notes-factory/index.html's EXAM_TYPES/subject <select> for the
          # full label list). Labels with no mapping here are skipped with a warning
          # rather than auto-creating a stray near-duplicate term — add a line here
          # once you decide what term a new label should map to.
          declare -A EXAM_TERM_MAP=(
            ["CTET Paper I"]="CTET"
            ["CTET Paper II"]="CTET"
            ["PGT"]="PGT"
            ["TGT"]="TGT"
            ["KVS"]="KVS"
            ["NVS"]="NVS"
            ["DSSSB"]="DSSSB PRT"
            ["UPTET"]="UPTET"
            ["BPSC TRE"]="BPSC TRE"
          )
          declare -A SUBJECT_TERM_MAP=(
            ["CDP"]="Child Development & Pedagogy"
            ["Geography"]="Geography"
            ["History"]="History"
            ["Science"]="Science"
            ["Maths"]="Maths"
            ["Hindi"]="Hindi"
            ["English"]="English"
            ["EVS"]="EVS"
          )
          # "Auto-detect" is intentionally unmapped — the app never resolves what
          # subject it auto-detected to, so there's nothing reliable to assign.

          # Look up a term by exact name in a taxonomy; create it if missing.
          # Prints the term ID on success, prints nothing (just a ::warning::) on failure.
          # Never propagates a hard failure (network hiccup, non-2xx, unparseable
          # response) up via set -e/pipefail — a term-assignment miss must degrade
          # to a warning for this one term, not abort the whole publish run.
          resolve_term_id(){
            local tax="$1" name="$2" enc id http
            enc="$(jq -rn --arg n "$name" '$n|@uri')"
            http="$(curl -sS -o /tmp/term-search.json -w "%{http_code}" \
                      "${WP_SITE_URL%/}/wp-json/wp/v2/${tax}?search=${enc}&per_page=100" \
                      -u "$WP_USERNAME:$WP_APP_PASSWORD" || echo "000")"
            id=""
            if [ "$http" = "200" ]; then
              id="$(jq -r --arg n "$name" '[.[] | select(.name==$n)] | .[0].id // empty' /tmp/term-search.json 2>/dev/null || true)"
            fi
            if [ -n "$id" ]; then echo "$id"; return 0; fi
            http="$(curl -sS -o /tmp/term-resp.json -w "%{http_code}" \
                      -X POST "${WP_SITE_URL%/}/wp-json/wp/v2/${tax}" \
                      -H "Content-Type: application/json" \
                      -u "$WP_USERNAME:$WP_APP_PASSWORD" \
                      --data-binary "$(jq -n --arg n "$name" '{name:$n}')" || echo "000")"
            if [ "$http" = "201" ]; then
              jq -r '.id' /tmp/term-resp.json 2>/dev/null || true
            else
              echo "::warning::Could not find or create $tax term \"$name\" (HTTP $http) — skipping this term assignment." >&2
            fi
            return 0
          }

          shopt -s nullglob
          if [ -n "$ONLY_FILE" ]; then
            files=("$ONLY_FILE")
          else
            files=(pending-notes/*.json)
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing to publish — pending-notes/ is empty."
            exit 0
          fi

          mkdir -p published-notes
          mkdir -p Automation/content-memory
          failed=0

          # After a successful publish, save a lightweight content-memory record
          # (see Automation/content-memory/README.md) — never the full article,
          # just the AI-reported concepts/misconceptions/examples/shape it used,
          # so a future prompt run can be told what's already been covered on
          # this exam and avoid converging on the same choices. Silently a
          # no-op if the bundle carries no .contentMemory (older prompt reply,
          # or the model's block failed to parse) — this must never fail the
          # publish itself.
          write_content_memory(){
            local f="$1" slug="$2" post_id="$3" post_link="$4"
            local cm
            cm="$(jq -c '.contentMemory // empty' "$f" 2>/dev/null || true)"
            [ -z "$cm" ] && return 0
            # Aside-card sentences (Teacher Tip/Exam Point/Exam Trap/etc.) —
            # extracted server-side here, never AI-self-reported, because
            # three diagnostic test runs reproduced several of these
            # byte-for-byte identical, a repetition class the AI's own
            # contentMemory block never tracked. See editorial-evaluation.mjs
            # and editorial-intelligence.mjs's buildEditorialSignature().
            local cards
            cards="$(node Automation/core/src/editorial-evaluation.mjs --extract-cards "$f" 2>/dev/null || echo '[]')"
            echo "$cards" | jq -e . >/dev/null 2>&1 || cards='[]'
            jq -n --argjson cm "$cm" --argjson cards "$cards" --arg id "$slug" --arg topic "$(jq -r '.topic // ""' "$f")" \
              --arg subject "$(jq -r '.subject // ""' "$f")" --arg exam "$(jq -r '.examType // ""' "$f")" \
              --arg type "note" --arg postId "$post_id" --arg link "$post_link" \
              --arg published "$(date -u +%FT%TZ)" \
              '{id:$id, type:$type, topic:$topic, subject:$subject, exam:$exam} + $cm +
               {card_sentences_used:$cards, postId:$postId, link:$link, published:$published}' \
              > "Automation/content-memory/$slug.json" 2>/dev/null || {
                echo "::warning::$slug — failed to write content-memory record (non-fatal, publish already succeeded)."
                return 0
              }
            git add "Automation/content-memory/$slug.json"
          }

          # Local, non-blocking content-differentiation check (5-gram Jaccard
          # against the last 30 published notes — see
          # Automation/core/src/similarity-check.mjs). Informational only:
          # appended to the article's own publisherNotes field for a human
          # editor to see, never used to reject or alter the publish itself.
          write_similarity_note(){
            local f="$1"
            local sim_json
            sim_json="$(node Automation/core/src/similarity-check.mjs "$f" published-notes 30 2>/dev/null || true)"
            [ -z "$sim_json" ] && return 0
            local sim_note
            sim_note="$(echo "$sim_json" | jq -r '
              if (.closest | length) == 0 then empty else
                "\n\n--- LOCAL CONTENT-DIFFERENTIATION CHECK (informational; not a rejection gate) ---\nCompared against \(.comparedAgainst) recently published notes using 5-gram overlap.\nClosest matches:\n" +
                ([.closest[] | "- \(.slug): \((.similarity*100)|floor)% overlap"] | join("\n"))
              end' 2>/dev/null || true)"
            [ -z "$sim_note" ] && return 0
            jq --arg note "$sim_note" '.publisherNotes = ((.publisherNotes // "") + $note)' "$f" > /tmp/pn.json 2>/dev/null \
              && mv /tmp/pn.json "$f" && git add "$f"
          }

          # Everything that touches one file lives in this function, called as
          # an `if` condition below. This is deliberate, not cosmetic: bash's
          # `set -e` explicitly exempts a command used as an if/while condition
          # from aborting the script on failure — so ANY internal failure here
          # (a jq error, an unexpected WordPress response, a future bug nobody
          # anticipated) makes ONLY this one file fail; it can never take down
          # the whole batch or leave later files unprocessed.
          process_one(){
            local f="$1" slug
            slug="$(basename "$f" .json)"
            echo "── Processing $slug ──"

            # An update run (see notes-factory's "Update an existing note"
            # flow) carries the old wordpress.postId forward in the pending
            # file itself — that's the signal to PUT-update the existing
            # post instead of the normal dedupe-guard/POST-create path below.
            update_post_id="$(jq -r '.wordpress.postId // empty' "$f")"

            # dedupe guard: re-uploading the same slug WITHOUT a carried-over
            # postId must not create a second draft — but an update run is
            # expected to already have a published-notes/$slug.json (the one
            # it's replacing), so it skips this guard entirely.
            if [ -z "$update_post_id" ] && [ -f "published-notes/$slug.json" ]; then
              echo "::warning::$slug already published earlier (published-notes/$slug.json exists) — skipping to avoid a duplicate draft. Delete that file first if you really want to publish again, or use notes-factory's update flow to carry the postId forward."
              git rm -q "$f"
              return 0
            fi

            # validate the JSON before touching WordPress
            if ! jq -e '.seo.seoTitle and .seo.slug and .bodyHtml' "$f" >/dev/null 2>&1; then
              echo "::error::$f is not valid — needs seo.seoTitle, seo.slug and bodyHtml. Leaving it in pending-notes/."
              return 1
            fi

            # Resolve exam/subject taxonomy term IDs for this note (see the maps above).
            exam_ids=()
            raw_exam="$(jq -r '.examType // empty' "$f")"
            if [ -n "$raw_exam" ]; then
              IFS='/' read -ra exam_labels <<< "$raw_exam"
              for raw_label in "${exam_labels[@]}"; do
                label="$(echo "$raw_label" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                [ -z "$label" ] && continue
                mapped="${EXAM_TERM_MAP[$label]:-}"
                if [ -z "$mapped" ]; then
                  echo "::warning::$slug — no exam-taxonomy mapping for \"$label\", leaving unassigned."
                  continue
                fi
                tid="$(resolve_term_id exam "$mapped")"
                [ -n "$tid" ] && exam_ids+=("$tid")
              done
            fi
            exam_ids_json="[]"
            [ ${#exam_ids[@]} -gt 0 ] && exam_ids_json="$(printf '%s\n' "${exam_ids[@]}" | jq -R . | jq -sc 'map(tonumber)')"

            subject_ids_json="[]"
            raw_subject="$(jq -r '.subject // empty' "$f")"
            if [ -n "$raw_subject" ] && [ "$raw_subject" != "Auto-detect" ]; then
              mapped="${SUBJECT_TERM_MAP[$raw_subject]:-}"
              if [ -n "$mapped" ]; then
                tid="$(resolve_term_id subject "$mapped")"
                [ -n "$tid" ] && subject_ids_json="[$tid]"
              else
                echo "::warning::$slug — no subject-taxonomy mapping for \"$raw_subject\", leaving unassigned."
              fi
            fi

            # Featured image: an optional companion file the browser tool commits
            # alongside the JSON (pending-notes/<slug>.<ext>) once the user pastes
            # an externally-generated image back into the app — this workflow
            # never generates images itself, only uploads what's already there.
            # Upload it to the WP media library, tag it with the SEO alt text,
            # and remember its URL/id so the payload below can wire it in as the
            # featured image. Mirrors pub-lpost.yml.
            media_id=""
            media_url=""
            img_file=""
            img_ext=""
            for ext in jpg jpeg png webp; do
              if [ -f "pending-notes/$slug.$ext" ]; then
                img_file="pending-notes/$slug.$ext"
                img_ext="$ext"
                break
              fi
            done
            if [ -n "$img_file" ]; then
              content_type="image/jpeg"
              case "$img_ext" in
                png) content_type="image/png" ;;
                webp) content_type="image/webp" ;;
              esac
              media_http="$(curl -sS -o /tmp/media-response.json -w "%{http_code}" \
                -X POST "${WP_SITE_URL%/}/wp-json/wp/v2/media" \
                -H "Content-Disposition: attachment; filename=\"$slug-featured.$img_ext\"" \
                -H "Content-Type: $content_type" \
                -u "$WP_USERNAME:$WP_APP_PASSWORD" \
                --data-binary "@$img_file" || echo "000")"
              if [ "$media_http" = "201" ]; then
                media_id="$(jq -r '.id' /tmp/media-response.json)"
                media_url="$(jq -r '.source_url' /tmp/media-response.json)"
                echo "✔ Featured image uploaded: id=$media_id  $media_url"
                alt_text="$(jq -r '.seo.imageAltText // ""' "$f")"
                curl -sS -o /dev/null -X POST "${WP_SITE_URL%/}/wp-json/wp/v2/media/$media_id" \
                  -H "Content-Type: application/json" \
                  -u "$WP_USERNAME:$WP_APP_PASSWORD" \
                  --data-binary "$(jq -n --arg alt "$alt_text" '{alt_text:$alt, title:$alt}')" >/dev/null || true
              else
                echo "::warning::$slug — featured image upload failed (HTTP $media_http), continuing without it."
                cat /tmp/media-response.json || true
              fi
            fi

            # Wrap the body in Gutenberg Custom-HTML block markup so the editor
            # shows ONE proper Custom HTML block (the only block type that renders
            # the inline-styled cards verbatim) instead of unstructured classic
            # content. A leading <h1> is stripped first: the post title already IS
            # the page H1, so one inside the body would double the H1 on-page.
            # HTML comments (AI scaffolding like <!-- SECTION 1 --> or
            # <!-- End of Notes Body -->) are stripped too — they're invisible to
            # readers but sit in the page source as a giveaway that the content
            # is AI-generated, and files can land here via the manual upload
            # fallback without ever passing through the notes-factory tool's own
            # comment-stripping, so this is the last guaranteed gate before WordPress.
            payload="$(jq --argjson exam "$exam_ids_json" --argjson subj "$subject_ids_json" '{
              title: .seo.h1,
              slug: .seo.slug,
              excerpt: .seo.metaDescription,
              content: ("<!-- wp:html -->\n" + (.bodyHtml | gsub("<!--.*?-->"; ""; "s") | sub("^\\s*<h1[^>]*>[\\s\\S]*?</h1>\\s*"; "")) + "\n<!-- /wp:html -->"),
              status: "draft",
              meta: {
                rank_math_focus_keyword: (.seo.focusKeyword // ""),
                rank_math_title: (.seo.seoTitle // ""),
                rank_math_description: (.seo.metaDescription // "")
              }
            } | if .title == null or .title == "" then .title = .slug else . end
              | if ($exam|length) > 0 then .exam = $exam else . end
              | if ($subj|length) > 0 then .subject = $subj else . end' "$f")"
            if [ -n "$media_id" ]; then
              payload="$(echo "$payload" | jq --argjson mid "$media_id" '. + {featured_media: $mid}')"
            fi

            # Update runs PUT to the existing post (keeps its ID/link, WP bumps
            # modified date); fresh notes POST to create. Same payload either way,
            # EXCEPT status: an update must never force a post back to "draft" —
            # if you'd already manually published it live on WordPress, a content
            # refresh silently reverting it to draft would be a real regression.
            # WP's REST API leaves omitted fields unchanged on an update, so
            # dropping status here preserves whatever it currently is.
            if [ -n "$update_post_id" ]; then
              payload="$(echo "$payload" | jq 'del(.status)')"
              wp_method="PUT"
              wp_url="${WP_SITE_URL%/}/wp-json/wp/v2/free_notes/$update_post_id"
              ok_code="200"
            else
              wp_method="POST"
              wp_url="${WP_SITE_URL%/}/wp-json/wp/v2/free_notes"
              ok_code="201"
            fi

            # HTTP 000 means curl couldn't connect at all (transient network/hosting
            # blip, not a WordPress-side rejection) — worth a couple of retries
            # before giving up, since these have recurred and cost a whole draft.
            #
            # The payload is piped into curl via stdin (--data-binary @-)
            # rather than passed as a command-line argument (--data-binary
            # "$payload") — a long note's JSON easily exceeds the OS's
            # execve() argument-size limit ("Argument list too long" / E2BIG),
            # which curl can't even start under, and which this loop's
            # `|| echo "000"` was silently misreporting as a network failure.
            # Ported from pub-lpost.yml, which hit this exact incident
            # (a 172KB pending file, logged as three bogus "connection attempt
            # failed" retries) and fixed it there — this workflow was never
            # updated to match, so notes kept failing this way. echo is a
            # shell builtin here, not an exec'd process, so it isn't subject
            # to that argument-size limit either.
            http_code="000"
            for attempt in 1 2 3; do
              http_code="$(echo "$payload" | curl -sS -o /tmp/wp-response.json -w "%{http_code}" \
                -X "$wp_method" "$wp_url" \
                -H "Content-Type: application/json" \
                -u "$WP_USERNAME:$WP_APP_PASSWORD" \
                --data-binary @- || echo "000")"
              [ "$http_code" != "000" ] && break
              echo "::warning::$slug — connection attempt $attempt to WordPress failed, retrying…"
              sleep 5
            done

            # If WP rejects the meta keys (Rank Math REST snippet not installed yet),
            # retry once without meta so the draft is never lost — with a loud warning.
            if [ "$http_code" = "400" ] || [ "$http_code" = "403" ]; then
              if grep -q "rank_math" /tmp/wp-response.json 2>/dev/null; then
                echo "::warning::$slug — WordPress rejected the Rank Math meta fields. Install the register-rank-math-meta snippet (see notes-factory/README.md) to publish SEO fields automatically. Retrying WITHOUT meta so the draft still lands; paste the Rank Math fields manually for this post."
                payload="$(echo "$payload" | jq 'del(.meta)')"
                http_code="$(echo "$payload" | curl -sS -o /tmp/wp-response.json -w "%{http_code}" \
                  -X "$wp_method" "$wp_url" \
                  -H "Content-Type: application/json" \
                  -u "$WP_USERNAME:$WP_APP_PASSWORD" \
                  --data-binary @- || echo "000")"
              fi
            fi

            # An update targeting a postId that no longer exists (deleted/
            # trashed on WordPress) has nothing left to protect by failing —
            # fall back to publishing as a brand-new post instead of leaving
            # it stuck in pending-notes/ forever. Any OTHER failure
            # (400/403/500/network) still hard-fails below for a human to
            # review — auto-retrying those could just as easily publish
            # something wrong (bad content, malformed payload) under a new
            # post with nobody noticing.
            if [ -n "$update_post_id" ] && [ "$http_code" = "404" ]; then
              echo "::warning::$slug — WordPress post #$update_post_id no longer exists (404). Falling back to creating a new post instead of updating."
              payload="$(echo "$payload" | jq '. + {status: "draft"}')"
              wp_method="POST"
              wp_url="${WP_SITE_URL%/}/wp-json/wp/v2/free_notes"
              ok_code="201"
              update_post_id=""
              http_code="000"
              for attempt in 1 2 3; do
                http_code="$(echo "$payload" | curl -sS -o /tmp/wp-response.json -w "%{http_code}" \
                  -X "$wp_method" "$wp_url" \
                  -H "Content-Type: application/json" \
                  -u "$WP_USERNAME:$WP_APP_PASSWORD" \
                  --data-binary @- || echo "000")"
                [ "$http_code" != "000" ] && break
                echo "::warning::$slug — connection attempt $attempt to WordPress failed, retrying…"
                sleep 5
              done
            fi

            if [ "$http_code" = "$ok_code" ]; then
              post_id="$(jq -r '.id' /tmp/wp-response.json)"
              post_link="$(jq -r '.link' /tmp/wp-response.json)"
              verb="Draft created"; [ -n "$update_post_id" ] && verb="Existing post updated"
              echo "✔ $verb: id=$post_id  $post_link"
              jq --argjson id "$post_id" --arg link "$post_link" \
                 --arg mediaId "${media_id:-}" --arg mediaUrl "$media_url" \
                 --arg at "$(date -u +%FT%TZ)" \
                 '. + {wordpress: {postId: $id, link: $link, publishedAt: $at, status: "draft"} + (if $mediaId != "" then {featuredMediaId: ($mediaId|tonumber), featuredMediaUrl: $mediaUrl} else {} end)}' \
                 "$f" > "published-notes/$slug.json"
              git rm -q "$f"
              git add "published-notes/$slug.json"
              # the image is uploaded to the WP media library either way by this
              # point (or the upload failed and was already logged above) — the
              # companion file in pending-notes/ has served its purpose and would
              # otherwise sit there forever with no matching JSON once this
              # slug's dedupe guard starts skipping it on future runs.
              if [ -n "$img_file" ]; then
                git rm -q "$img_file" 2>/dev/null || true
              fi
              # Maintain a flat index of published slugs — GitHub Pages can't
              # directory-list, so reporting/index.html reads this file to know
              # which published-notes/*.json files exist (mirrors the same
              # index pub-lpost.yml maintains for published-long-posts/).
              [ -f "published-notes/index.json" ] || echo "[]" > "published-notes/index.json"
              jq --arg s "$slug" '(. - [$s]) + [$s]' "published-notes/index.json" > /tmp/notes-pub-index.json \
                && mv /tmp/notes-pub-index.json "published-notes/index.json"
              git add "published-notes/index.json"
              write_similarity_note "published-notes/$slug.json"
              write_content_memory "published-notes/$slug.json" "$slug" "$post_id" "$post_link"
            else
              echo "::error::WordPress rejected $slug (HTTP $http_code, method $wp_method). Response follows. File stays in pending-notes/ — fix the cause and re-run this workflow from the Actions tab."
              cat /tmp/wp-response.json || true
              return 1
            fi
          }

          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::warning::$f not found, skipping"; continue; }
            if ! process_one "$f"; then
              slug="$(basename "$f" .json)"
              echo "::error::Unexpected failure while processing $slug — see log above. Continuing with the remaining files rather than aborting the whole batch."
              failed=1
            fi
          done

          # commit whatever succeeded, even if something else failed. A push
          # can fail on a real race (another workflow run, or ED.REFRESH,
          # pushed in between) — retry with a rebase-pull a few times before
          # giving up, since losing an otherwise-successful publish to a
          # transient push race would be exactly the kind of failure this
          # refactor exists to eliminate. A single retry wasn't enough in
          # practice: every run reprocesses the FULL pending-notes/ glob (not
          # just the file that triggered it), so a note stuck retrying
          # WordPress connectivity gets swept up again by every later push,
          # and two such runs landing their bookkeeping commit within a few
          # seconds of each other is common, not rare.
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish note(s) to WordPress as draft [skip ci]"
            push_ok=0
            for attempt in 1 2 3 4 5; do
              if git push; then
                push_ok=1
                break
              fi
              echo "::warning::git push rejected (likely a concurrent run) — retrying after a rebase pull (attempt $attempt/5)."
              git rebase --abort >/dev/null 2>&1 || true
              if ! git pull --rebase origin main; then
                echo "::warning::rebase hit a conflict — aborting this attempt and re-fetching."
                git rebase --abort >/dev/null 2>&1 || true
                sleep 5
                continue
              fi
            done
            if [ "$push_ok" != "1" ]; then
              echo "::error::git push still failed after retries. The WordPress posts above ARE already live/drafted — only the repo's published-notes/ bookkeeping failed to commit. Re-run this workflow, or commit manually, to fix the bookkeeping; do not re-publish."
              failed=1
            fi
          fi

          exit $failed
