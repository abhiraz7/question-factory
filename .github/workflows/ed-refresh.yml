name: ED.REFRESH

# ACTIVE. This started as ed-refresh.yml.draft (GitHub Actions
# ignores .draft files) and was deliberately renamed live by a human after
# review, per Automation/core/GITHUB_WORKFLOWS_DESIGN.md's "do not create a
# real .yml file without a human reviewing it first" rule — see this
# file's git history for that review/decision.
#
# What this does: after a note or long post actually publishes, runs two
# already-tested scripts and commits their output back to main:
#   1. generate-next-post-ready.mjs (Phase 9/10), recommend-only mode (no
#      --topic). Now reads Automation/core/src/topic-bank-sources.mjs's
#      syllabus CSVs as a real topic backlog (see the design doc's "Open
#      questions" — item 1 is resolved), so this produces a genuine
#      nextTopicSuggestion, not just an exam+subject ranking.
#   2. generate-learned-state.mjs — a smaller, per-exam+subject summary
#      (article-shape repetition, coverage) that notes-factory/index.html's
#      buildPrompt() fetches directly (best-effort, degrades silently on
#      failure — see buildEditorialSignatureBlock()) to enrich its live
#      Phase-1 signature block with the one signal Phase 1 can't compute
#      client-side without porting retrieve.mjs off node:fs.
# This is the "Brain feeds the tool" half of the architecture — nothing here
# is on any human's critical path; Notes Factory itself does not depend on
# this workflow succeeding, running on time, or even existing.
#
# For this to actually return Search Console data (it runs fine without
# this too — see the degrade note below), add these repo secrets
# (Settings -> Secrets and variables -> Actions): GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET,
# GOOGLE_OAUTH_REFRESH_TOKEN (Search Console OAuth2 credentials — see
# Automation/core/src/gsc.mjs's header for exactly what scope/access these
# need) and GSC_SITE_URL (the exact property string Search Console shows —
# a URL-prefix property like "https://example.com/" or a domain property
# like "sc-domain:example.com"; deliberately not hardcoded anywhere in this
# public repo's source, only in this secret). Missing/wrong credentials or
# site URL never fail this workflow: gsc.mjs degrades to
# learner_signals.dataAvailable=false exactly like every other
# not-yet-wired signal in topic-state.mjs, so generate-next-post-ready.mjs
# still produces a valid (just Search-Console-blind) result either way.

on:
  workflow_run:
    workflows: ["PUB.NOTE", "PUB.LPOST"]
    types: [completed]
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: run for one specific topic instead of recommend-only mode (useful for manually testing e.g. the Search Console wiring end-to-end) — leave empty for the normal automatic behavior."
        required: false
        default: ""
      subject:
        description: "Subject, only used if topic is set."
        required: false
        default: ""
      exam:
        description: "Exam, only used if topic is set."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: editorial-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh editorial state (recommend-only unless a topic input was given)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TOPIC: ${{ inputs.topic }}
          SUBJECT: ${{ inputs.subject }}
          EXAM: ${{ inputs.exam }}
        run: |
          if [ -n "$TOPIC" ]; then
            node Automation/core/src/generate-next-post-ready.mjs --topic "$TOPIC" --subject "$SUBJECT" --exam "$EXAM"
          else
            node Automation/core/src/generate-next-post-ready.mjs
          fi

      - name: Refresh per-exam+subject learned state (notes-factory reads this directly)
        run: node Automation/core/src/generate-learned-state.mjs

      - name: Commit updated editorial state
        run: |
          set -euo pipefail
          if git diff --quiet -- generated/editorial/next-post-ready.json generated/editorial/learned-state.json; then
            echo "No change to generated/editorial/ — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/editorial/next-post-ready.json generated/editorial/learned-state.json
          git commit -m "Refresh editorial state [skip ci]"
          if ! git push; then
            echo "::warning::git push rejected (likely a concurrent run) — retrying once after a rebase pull."
            git pull --rebase origin main
            git push
          fi
